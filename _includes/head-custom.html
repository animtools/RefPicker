<!-- テーマ（primer）の既定の head-custom.html を置き換える。既定の中身は Google Analytics の読み込み（未設定）と favicon のコメントだけ -->
<!-- チップ表記（資料の整理ガイド）。GitHub のリポジトリ画面ではクラスが外れて文字だけになる -->
<style>
.rp-v, .rp-a, .rp-t { display: inline-block; padding: 0 8px; margin: 1px 0; border-radius: 999px; font-size: 90%; line-height: 1.6; white-space: nowrap; }
.rp-v { background: #e8f0fe; color: #1a4fa0; border: 1px solid #b9cdf5; }
.rp-a { background: #fff; color: #1a4fa0; border: 1px solid #1a4fa0; }
.rp-t { background: #e6f4ea; color: #1e6b34; border: 1px solid #b7dfc2; }
.rp-ax { opacity: .7; font-size: 85%; margin-right: .35em; }
.rp-note { display: inline-block; white-space: nowrap; font-size: 85%; color: #57606a; }
.rp-nw { white-space: nowrap; }
.mermaid { margin: 0 0 16px; text-align: center; }
</style>
<!-- Mermaid の図（共有ガイド・QUICKSTART）。GitHub Pages（kramdown）は ```mermaid をただのコードとして出すので、ここで図にする。リポジトリの画面は GitHub が自分で描く -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var codes = document.querySelectorAll("pre > code.language-mermaid");
  if (!codes.length || !window.mermaid) return;
  codes.forEach(function (code) {
    var div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = code.textContent;
    code.parentNode.replaceWith(div);
  });
  mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "strict" });
  mermaid.run({ querySelector: ".mermaid" });
});
</script>
