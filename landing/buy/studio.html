    安定購入ドア（RefPicker スタジオ用ライセンス）。
    **出荷済みビルドがこの URL を参照するため、パスを変えない・削除しない。**

    {ORIGIN}/buy/studio.html を開く。

    **販売はしていない。**組織向けのゲートは
    「配布物が取得でき、価格が確定し、**さらにテスターのFBが一巡して致命的な問題がない**こと」
    （biz-cycle-hub ADR 0004）。RefPicker はまだ現場での実演前なので、この条件を満たさない。

    ⚠ **404 にはしない。**このドアは配布済みビルドの共有ボタンから開かれる。
    404 だと「壊れている」と読まれるうえ、共有機能を使うのは**受け取り側が多い組織**で、
    その人たちが使い方に辿り着けなくなる（cycles/crossrefpicker.md D2）。
    売らないが、機能の存在と使い方は公開する — だからここは**問い合わせ先**にする。

    販売を開くときは、下の checkout URL への meta refresh + location.replace に戻す:
