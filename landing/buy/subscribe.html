    {ORIGIN}/buy/subscribe.html を開く。大文字小文字はこの綴りで固定

      ここに写すと価格改定で片方だけ古くなる）

    ★このドアを開けてよい根拠（biz-cycle-hub ADR 0004）:
    サブスクの条件は「解錠される配布物が1本以上実際に取得でき、実際にその配布物で
    Pro が解錠されること」。EconTemple が 2026-09-02 に v0.10.0-beta を公開して

    RefPicker 自身の段階（test）は条件ではない。

    （このファイルを消さないこと）。
